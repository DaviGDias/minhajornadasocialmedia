<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle in warm brand color -->
  <circle cx="32" cy="32" r="30" fill="#b26a26" />
  <circle cx="32" cy="32" r="30" stroke="#8c511b" stroke-width="2" />
  
  <!-- Outer globe rim -->
  <circle cx="32" cy="32" r="23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Central meridian & Equator -->
  <line x1="32" y1="9" x2="32" y2="55" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="9" y1="32" x2="55" y2="32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Longitude curves -->
  <ellipse cx="32" cy="32" rx="11.5" ry="23" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
  
  <!-- Latitude parallels -->
  <path d="M 14.5 21 Q 32 26 49.5 21" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 14.5 43 Q 32 38 49.5 43" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" />
</svg>
